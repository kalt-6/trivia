<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Vault</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="home-screen" class="container screen active">
        <h1>Trivia Vault</h1>
        <h2>Select a Quiz to Begin</h2>
        <ul id="quizzes-container">
            <li>Loading quizzes...</li>
        </ul>
    </div>

    <div id="quiz-screen" class="container screen">
        <h1 id="quiz-title">Quiz Title</h1>
        <h2 id="question-text">Question goes here...</h2>
        
        <div id="options-container"></div>
        
        <div id="feedback-text"></div>
        
        <button id="next-btn" onclick="nextQuestion()" style="display: none; margin-top: 15px;">Next Question</button>
    </div>

    <div id="results-screen" class="container screen">
        <h1>Quiz Complete!</h1>
        <h2 id="score-display">You scored: 0!</h2>
        <button onclick="returnHome()">Back to Menu</button>
    </div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <script>
        const supabaseUrl = 'https://pjjfnnzvwrhzvycjgkmz.supabase.co';
        const supabaseAnonKey = 'sb_publishable_J53ea-bCU35D1VSTK0l49A_b_BYW98W'; 
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        let currentQuizId = null;
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let correctlyTypedAnswers = [];
        let timerInterval; 

        const elements = {
            homeScreen: document.getElementById('home-screen'),
            quizScreen: document.getElementById('quiz-screen'),
            resultsScreen: document.getElementById('results-screen'),
            quizzesContainer: document.getElementById('quizzes-container'),
            quizTitle: document.getElementById('quiz-title'),
            questionText: document.getElementById('question-text'),
            optionsContainer: document.getElementById('options-container'),
            feedbackText: document.getElementById('feedback-text'),
            nextBtn: document.getElementById('next-btn'),
            scoreDisplay: document.getElementById('score-display')
        };

        async function init() { await fetchQuizzes(); }

        async function fetchQuizzes() {
            elements.quizzesContainer.innerHTML = '<li>Loading quizzes...</li>';
            const { data, error } = await supabaseClient.from('quizzes').select('*').order('id', { ascending: true });
            if (error) return;
            elements.quizzesContainer.innerHTML = '';
            data.forEach(quiz => {
                const li = document.createElement('li');
                const btn = document.createElement('button');
                btn.textContent = quiz.title;
                btn.onclick = () => startQuiz(quiz.id, quiz.title);
                li.appendChild(btn);
                elements.quizzesContainer.appendChild(li);
            });
        }

        async function startQuiz(quizId, title) {
            currentQuizId = quizId;
            currentQuestionIndex = 0;
            score = 0;
            elements.quizTitle.textContent = title;
            elements.homeScreen.classList.remove('active');
            elements.quizScreen.classList.add('active');
            const { data, error } = await supabaseClient.from('questions').select('*').eq('quiz_id', quizId);
            if (error) return;
            currentQuestions = data;
            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            if (timerInterval) clearInterval(timerInterval);
            
            const question = currentQuestions[currentQuestionIndex];
            elements.questionText.textContent = question.question_text;
            elements.optionsContainer.innerHTML = '';
            elements.feedbackText.textContent = '';
            elements.nextBtn.style.display = 'none';

            const optionsArray = typeof question.options === 'string' ? JSON.parse(question.options) : question.options;

            if (optionsArray[0] === "TYPE_HINT") {
                renderJetPunkGame(question, optionsArray.slice(1));
            } else if (optionsArray[0] === "TYPE") {
                renderTypingGame(question);
            } else {
                optionsArray.forEach(option => {
                    const btn = document.createElement('button');
                    btn.textContent = option;
                    btn.onclick = () => handleGuess(question.id, option, btn);
                    elements.optionsContainer.appendChild(btn);
                });
            }
        }

        async function handleGuess(questionId, selectedOption, buttonElement) {
            const allButtons = elements.optionsContainer.querySelectorAll('button');
            allButtons.forEach(btn => btn.disabled = true);
            elements.feedbackText.textContent = "Checking...";
            elements.feedbackText.className = '';

            const { data: isCorrect, error } = await supabaseClient.rpc('check_quiz_answer', { q_id: questionId, user_guess: selectedOption });

            if (isCorrect) {
                buttonElement.style.backgroundColor = '#22c55e'; 
                buttonElement.style.boxShadow = '0 6px 0px #16a34a';
                elements.feedbackText.textContent = "Correct!";
                elements.feedbackText.className = 'correct';
                score++;
            } else {
                buttonElement.style.backgroundColor = '#ef4444'; 
                buttonElement.style.boxShadow = '0 6px 0px #dc2626';
                elements.feedbackText.textContent = "Incorrect!";
                elements.feedbackText.className = 'incorrect';
            }
            elements.nextBtn.style.display = 'block';
        }

        function renderTypingGame(question) {
            correctlyTypedAnswers = []; 
            const validAnswers = question.correct_answer.split(',').map(a => a.trim());
            
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'Type an answer...';
            
            const answersList = document.createElement('ul');
            answersList.id = 'typed-answers-list';

            elements.optionsContainer.appendChild(input);
            elements.optionsContainer.appendChild(answersList);

            elements.nextBtn.textContent = "I'm Done / Next";
            elements.nextBtn.style.display = 'block';
            setTimeout(() => input.focus(), 100);

            input.addEventListener('input', function () {
                const guess = input.value.trim().toLowerCase();
                if (guess === '') return;
                
                const matchedAnswer = validAnswers.find(answer => answer.toLowerCase() === guess);

                if (matchedAnswer && !correctlyTypedAnswers.includes(matchedAnswer)) {
                    correctlyTypedAnswers.push(matchedAnswer);
                    score++; 
                    
                    const li = document.createElement('li');
                    li.textContent = matchedAnswer;
                    answersList.appendChild(li);
                    
                    elements.feedbackText.textContent = `Correct! (${correctlyTypedAnswers.length} / ${validAnswers.length})`;
                    elements.feedbackText.className = 'correct';
                    input.value = ''; 
                }
            });
        }

        function renderJetPunkGame(question, hintData) {
            correctlyTypedAnswers = [];
            const originalAnswers = question.correct_answer.split(',').map(a => a.trim());
            const validAnswers = originalAnswers.map(a => a.toLowerCase());
            
            const timerBox = document.createElement('div');
            timerBox.innerHTML = `<div style="font-size: 2.5rem; font-weight: 900; color: var(--secondary); margin-bottom: 15px;">⏱️ <span id="timer-sec">60</span>s</div>`;
            elements.optionsContainer.appendChild(timerBox);

            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = 'Type an answer...';
            input.autocomplete = 'off';
            elements.optionsContainer.appendChild(input);

            const grid = document.createElement('div');
            grid.style.display = 'grid';
            grid.style.gridTemplateColumns = '1fr 1fr';
            grid.style.gap = '12px';
            grid.style.marginBottom = '20px';
            
            hintData.forEach((h, i) => {
                const item = document.createElement('div');
                item.style.border = '2px solid var(--primary)';
                item.style.borderRadius = '12px';
                item.style.padding = '12px';
                item.style.background = '#f8fafc';
                item.innerHTML = `<div style="font-size: 0.85rem; color: var(--text-light); text-transform: uppercase; margin-bottom: 4px; font-weight: bold;">${h.hint}</div>
                                  <div class="answer-cell" style="font-weight: 900; color: #cbd5e1; font-size: 1.1rem;">???</div>`;
                grid.appendChild(item);
            });
            elements.optionsContainer.appendChild(grid);

            elements.nextBtn.style.display = 'block';
            elements.nextBtn.textContent = "Give Up / Next";

            let timeLeft = 60;
            timerInterval = setInterval(() => {
                timeLeft--;
                const display = document.getElementById('timer-sec');
                if (display) display.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    input.disabled = true;
                    input.placeholder = "Time's up!";
                    elements.feedbackText.textContent = "Game Over!";
                    elements.feedbackText.className = 'incorrect';
                    
                    hintData.forEach((h, i) => {
                        const cell = grid.children[i].querySelector('.answer-cell');
                        if (cell.textContent === '???') {
                            cell.textContent = h.answer;
                            cell.style.color = '#ef4444';
                        }
                    });
                }
            }, 1000);

            input.addEventListener('input', () => {
                const guess = input.value.trim().toLowerCase();
                const matchIdx = validAnswers.indexOf(guess);
                
                if (matchIdx !== -1 && !correctlyTypedAnswers.includes(guess)) {
                    correctlyTypedAnswers.push(guess);
                    score++;
                    
                    const cell = grid.children[matchIdx].querySelector('.answer-cell');
                    cell.textContent = originalAnswers[matchIdx];
                    cell.style.color = '#22c55e';
                    
                    input.value = '';
                    elements.feedbackText.textContent = `Correct! (${correctlyTypedAnswers.length}/${validAnswers.length})`;
                    elements.feedbackText.className = 'correct';
                    
                    if (correctlyTypedAnswers.length === validAnswers.length) {
                        clearInterval(timerInterval);
                        input.disabled = true;
                        input.placeholder = "Perfect Score!";
                        elements.feedbackText.textContent = "You got them all!";
                    }
                }
            });
            setTimeout(() => input.focus(), 100);
        }

        function nextQuestion() {
            if (timerInterval) clearInterval(timerInterval);
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) renderCurrentQuestion();
            else showResults();
        }

        function showResults() {
            elements.quizScreen.classList.remove('active');
            elements.resultsScreen.classList.add('active');
            elements.scoreDisplay.textContent = `You scored: ${score}!`;
        }

        function returnHome() {
            elements.resultsScreen.classList.remove('active');
            elements.homeScreen.classList.add('active');
            fetchQuizzes();
        }

        window.nextQuestion = nextQuestion;
        window.returnHome = returnHome;
        init();
    </script>
</body>
</html>
