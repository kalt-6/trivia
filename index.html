<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Vault | Playful Edition</title>
    
    <!-- External Resources & Libraries -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#8b5cf6', 'primary-hover': '#7c3aed',
                        secondary: '#ec4899', accent: '#f59e0b',
                        background: '#fdf4ff', surface: '#ffffff',
                        'text-main': '#1e293b', 'text-light': '#64748b',
                    },
                    fontFamily: { sans: ['Nunito', 'sans-serif'] }
                }
            }
        }
    </script>

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col font-sans">

    <!-- Navigation Bar -->
    <nav class="bg-surface border-b-4 border-primary sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
            <div class="flex items-center cursor-pointer transform transition hover:scale-105" onclick="App.goHome()">
                <i class="fas fa-brain text-primary text-3xl mr-3"></i>
                <span class="font-extrabold text-2xl tracking-tight text-text-main uppercase">Trivia<span class="text-primary">Vault</span></span>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8" id="app-root">
        <!-- Application dynamically renders here -->
    </main>

    <!-- External JavaScript Application Logic -->
    <script src="app.js"></script>
</body>
</html>
